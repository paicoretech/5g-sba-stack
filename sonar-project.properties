sonar.projectKey=sba-stack
sonar.projectName=sba-stack
sonar.modules=sba-stack-core,sba-stack-http2,sba-stack-security,sba-stack-discovery,sba-stack-codec,sba-stack-testing

sba-stack-core.sonar.sources=src/main/java
sba-stack-core.sonar.tests=src/test/java
sba-stack-http2.sonar.sources=src/main/java
sba-stack-http2.sonar.tests=src/test/java
sba-stack-security.sonar.sources=src/main/java
sba-stack-security.sonar.tests=src/test/java
sba-stack-discovery.sonar.sources=src/main/java
sba-stack-discovery.sonar.tests=src/test/java
sba-stack-codec.sonar.sources=src/main/java
sba-stack-codec.sonar.tests=src/test/java
sba-stack-testing.sonar.sources=src/main/java

# OpenAPI-generated DTOs live under target/generated-sources and Lombok @Data /
# @Builder classes trip MALICIOUS_CODE rules (EI_EXPOSE_REP/REP2) by design; both
# are out of scope for application-level review.
sonar.exclusions=**/openapi/model/**,**/target/generated-sources/**
sonar.coverage.exclusions=**/openapi/model/**,**/dto/**,**/transport/http2/dto/**

sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.jacoco.reportPaths=target/jacoco.exec
